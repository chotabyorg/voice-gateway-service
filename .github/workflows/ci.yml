name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"
      - name: Install pinned development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libc++1
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check typed boundary
        run: mypy
      - name: Compile and import
        run: |
          python -m compileall -q voice_gateway tests
          python -c 'import voice_gateway.app; import voice_gateway.media.call'
      - name: Unit and process integration tests
        run: pytest -q
      - name: Validate Compose file
        run: docker compose config --quiet

  container:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t voice-gateway-ci:"$GITHUB_SHA" .
      - name: Run inert container smoke
        run: |
          CI_NETWORK="voice-gateway-${GITHUB_RUN_ID}"
          docker network create --internal "$CI_NETWORK"
          docker run -d --name voice-gateway-ci \
            --network "$CI_NETWORK" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true --init \
            -e VOICE_MODE=disabled -e VOICE_HTTP_HOST=0.0.0.0 \
            voice-gateway-ci:"$GITHUB_SHA"
          trap 'docker rm -f voice-gateway-ci >/dev/null 2>&1 || true; docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if docker exec voice-gateway-ci python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)' >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          docker exec voice-gateway-ci python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1).status == 200'
          test "$(docker inspect -f '{{.Config.User}}' voice-gateway-ci)" = "10001:10001"
          docker stop --time 10 voice-gateway-ci
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' voice-gateway-ci)"
          test "$EXIT_CODE" = "0" || test "$EXIT_CODE" = "143"
          docker logs voice-gateway-ci 2>&1 | grep -q 'Application shutdown complete'
          docker rm voice-gateway-ci
          docker network rm "$CI_NETWORK"
          trap - EXIT
      - name: Run fake call, restart, and graceful container shutdown
        run: |
          CI_NETWORK="voice-gateway-fake-${GITHUB_RUN_ID}"
          docker network create --internal "$CI_NETWORK"
          docker run -d --name voice-gateway-fake \
            --network "$CI_NETWORK" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true --init \
            -e VOICE_MODE=local_fake -e VOICE_HTTP_HOST=0.0.0.0 \
            -e VOICE_AUDIOSOCKET_HOST=0.0.0.0 -e VOICE_AUDIOSOCKET_PORT=55585 \
            voice-gateway-ci:"$GITHUB_SHA"
          trap 'docker rm -f voice-gateway-fake >/dev/null 2>&1 || true; docker network rm "$CI_NETWORK" >/dev/null 2>&1 || true' EXIT
          docker exec -i voice-gateway-fake python - 127.0.0.1:8000 127.0.0.1:55585 < scripts/container_smoke.py
          docker restart --time 10 voice-gateway-fake
          docker exec -i voice-gateway-fake python - 127.0.0.1:8000 127.0.0.1:55585 health-only < scripts/container_smoke.py
          docker stop --time 10 voice-gateway-fake
          EXIT_CODE="$(docker inspect -f '{{.State.ExitCode}}' voice-gateway-fake)"
          test "$EXIT_CODE" = "0" || test "$EXIT_CODE" = "143"
          docker logs voice-gateway-fake 2>&1 | grep -q 'Application shutdown complete'
