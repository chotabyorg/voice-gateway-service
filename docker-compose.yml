services:
  voice-gateway:
    build: .
    image: voice-gateway-service:local
    environment:
      VOICE_MODE: ${VOICE_MODE:-disabled}
      VOICE_HTTP_HOST: 0.0.0.0
      VOICE_HTTP_PORT: 8000
      VOICE_AUDIOSOCKET_HOST: 0.0.0.0
      VOICE_AUDIOSOCKET_PORT: 55585
      VOICE_AUDIOSOCKET_IDLE_TIMEOUT_SECONDS: 30
      VOICE_MAX_CALLS: 4
      VOICE_MAX_FRAME_BYTES: 4096
      VOICE_MAX_CALL_SECONDS: 600
      VOICE_SHUTDOWN_TIMEOUT_SECONDS: 8
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:55585:55585"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    networks:
      - voice-local

networks:
  voice-local:
    driver: bridge
